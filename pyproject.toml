[project]
name = "geomd"
version = "0.2.0"
description = "GeoMarkdown is a Markdown dialect for geodata. This package provides parsers and renderers that convert between GeoMarkdown and GeoJSON"
readme = "README.md"
authors = [
    { name = "Sergei" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "geojson>=3.3.0",
    "mistune>=3.3.4",
]

[project.scripts]
geomd = "geomd:main"

[project.urls]
Homepage = "https://github.com/spapulin/geomd"
Repository = "https://github.com/spapulin/geomd"
Issues = "https://github.com/spapulin/geomd/issues"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
api = [
    "requests>=2.34.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0"
]
mcp = ["fastmcp>=4.0.10"]
test = [
    "pytest>=8",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=8",
    "ruff>=0.6",
]
api = [
    "requests>=2.34.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0"
]
mcp = ["fastmcp>=4.0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Notebook cell imports are managed by the notebook editor.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # the line length limit is advisory in this project
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI reads the query parameters from the default values.
"app.py" = ["B008"]
